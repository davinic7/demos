<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B8456B">
<title>Dulce encanto · Costos y pedidos</title>
<style>
  :root{
    --bg:#FFF7F2; --card:#FFFFFF; --ink:#3A2622; --muted:#8A716B;
    --rose:#B8456B; --rose-soft:#FBE3EA; --choco:#6B3F2E; --mint:#2E8B6E; --mint-soft:#DDF3EA;
    --amber:#B7791F; --amber-soft:#FCEFD6; --line:#F0E2DC; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  body{padding-bottom:84px}
  header{background:linear-gradient(135deg,#B8456B,#8E3456);color:#fff;padding:22px 18px 18px;border-radius:0 0 24px 24px}
  header .brand{font-size:13px;opacity:.85;letter-spacing:.3px}
  header h1{margin:4px 0 0;font-size:24px;font-weight:700}
  header p{margin:4px 0 0;font-size:14px;opacity:.9}
  main{padding:16px 16px 70px;max-width:560px;margin:0 auto}
  h2{font-size:18px;margin:6px 0 12px}
  .hint{font-size:13px;color:var(--muted);margin:-6px 0 14px}
  .card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(58,38,34,.07);border:1px solid var(--line)}
  .card.tap{cursor:pointer}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .title{font-weight:650;font-size:16px}
  .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:var(--bg);border-radius:12px;padding:8px 10px}
  .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .stat .v{font-size:16px;font-weight:700;margin-top:2px}
  .v.rose{color:var(--rose)} .v.mint{color:var(--mint)}
  .chip{display:inline-block;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;border:none;cursor:pointer}
  .chip.pend{background:var(--amber-soft);color:var(--amber)}
  .chip.entr{background:var(--rose-soft);color:var(--rose)}
  .chip.cobr{background:var(--mint-soft);color:var(--mint)}
  .badge{font-size:12px;background:var(--rose-soft);color:var(--rose);padding:3px 8px;border-radius:999px;font-weight:600}
  .big{font-size:34px;font-weight:800;color:var(--mint);margin:4px 0}
  .bar{height:8px;background:var(--rose-soft);border-radius:99px;overflow:hidden;margin-top:6px}
  .bar>span{display:block;height:100%;background:var(--rose);border-radius:99px}
  nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}
  nav button{flex:1;background:none;border:none;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;cursor:pointer;font-family:inherit}
  nav button .ic{font-size:21px;line-height:1}
  nav button.on{color:var(--rose);font-weight:700}
  .fab{position:fixed;right:18px;bottom:88px;width:58px;height:58px;border-radius:50%;background:var(--rose);color:#fff;font-size:30px;border:none;box-shadow:0 6px 16px rgba(184,69,107,.4);cursor:pointer;z-index:6}
  .sheet-bg{position:fixed;inset:0;background:rgba(40,20,20,.45);display:none;z-index:10;align-items:flex-end;justify-content:center}
  .sheet-bg.open{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px 26px}
  .sheet h3{margin:0 0 14px;font-size:19px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--rose)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ing{display:grid;grid-template-columns:1fr 92px 34px;gap:6px;align-items:center;margin-bottom:6px}
  .ing .u{font-size:12px;color:var(--muted)}
  .x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
  .btn{display:block;width:100%;padding:14px;border-radius:14px;border:none;font-size:16px;font-weight:700;margin-top:14px;cursor:pointer;font-family:inherit}
  .btn.pri{background:var(--rose);color:#fff}
  .btn.sec{background:var(--rose-soft);color:var(--rose)}
  .btn.ghost{background:none;color:var(--muted);font-weight:600}
  .live{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:14px}
  .live .row{padding:3px 0;font-size:14px}
  .live .row b{font-size:15px}
  .live .tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:10px 4px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .seg button.on{border-color:var(--rose);background:var(--rose-soft);color:var(--rose);font-weight:700}
  footer{text-align:center;font-size:12px;color:var(--muted);padding:10px 0 20px}
  footer b{color:var(--choco)}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;z-index:20;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand">DaviNic Developer · demo</div>
  <h1>Dulce encanto 🧁</h1>
  <p id="hdr-sub">Costos, precios y pedidos</p>
</header>

<main id="view"></main>
<footer>Demo hecha por <b>DaviNic Developer</b> · Catamarca</footer>

<button class="fab" id="fab" aria-label="Agregar">+</button>

<nav id="nav">
  <button data-t="productos" class="on"><span class="ic">🍰</span>Productos</button>
  <button data-t="insumos"><span class="ic">🧺</span>Insumos</button>
  <button data-t="pedidos"><span class="ic">📝</span>Pedidos</button>
  <button data-t="resumen"><span class="ic">📊</span>Mi mes</button>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='dulceencanto_demo_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
const money2=n=>'$'+(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,9);
const roundUp=n=>Math.ceil(n/100)*100;
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ESTADOS={pend:'Pendiente',entr:'Entregado',cobr:'Cobrado'};
const NEXT={pend:'entr',entr:'cobr',cobr:'pend'};

const pad=n=>String(n).padStart(2,'0');
function isoDay(offset){const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function sample(){
  const I=[
    ['harina','Harina 0000',1200,1000,'g'],['maicena','Maicena',1500,500,'g'],
    ['azucar','Azúcar',1400,1000,'g'],['manteca','Manteca',3200,200,'g'],
    ['huevos','Huevos (maple)',7500,30,'u'],['crema','Crema de leche',4500,500,'ml'],
    ['ddl','Dulce de leche repostero',5500,1000,'g'],['choco','Chocolate cobertura',14000,1000,'g'],
    ['cacao','Cacao amargo',4800,360,'g']
  ].map(([id,nombre,precio,cantidad,unidad])=>({id,nombre,precio,cantidad,unidad}));
  const R=[
    {id:'alf',nombre:'Alfajores de maicena',rinde:24,packaging:150,margen:2.5,precio:0,
     items:[['maicena',300],['harina',200],['manteca',200],['azucar',150],['huevos',3],['ddl',500]]},
    {id:'torta',nombre:'Torta de chocolate',rinde:1,packaging:1500,margen:2.5,precio:0,
     items:[['harina',300],['azucar',300],['manteca',200],['huevos',6],['cacao',80],['crema',500],['choco',200]]},
    {id:'brow',nombre:'Brownies',rinde:16,packaging:100,margen:2.5,precio:0,
     items:[['choco',200],['manteca',200],['azucar',250],['huevos',4],['harina',100]]}
  ].map(r=>({...r,items:r.items.map(([insumoId,cant])=>({insumoId,cant}))}));
  const d=new Date().getDate();
  const off=n=>-Math.min(n,d-1);
  const P=[
    ['Sofía M.','alf',24,off(9),'cobr'],['Cumple de Mateo','torta',1,off(7),'cobr'],
    ['Carla (vecina)','brow',8,off(5),'cobr'],['Evento escolar','alf',36,off(3),'entr'],
    ['Florencia R.','torta',1,off(1),'pend'],['Julián','brow',16,0,'pend']
  ].map(([cliente,recetaId,cantidad,o,estado])=>({id:uid(),cliente,recetaId,cantidad,fecha:isoDay(o),estado}));
  return {insumos:I,recetas:R,pedidos:P};
}
let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.insumos)db=sample();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}

const ins=id=>db.insumos.find(i=>i.id===id);
const rec=id=>db.recetas.find(r=>r.id===id);
const unitCost=i=>i&&i.cantidad?i.precio/i.cantidad:0;
function costos(r){
  const tanda=r.items.reduce((s,it)=>s+unitCost(ins(it.insumoId))*(+it.cant||0),0);
  const porUnidad=tanda/(+r.rinde||1)+(+r.packaging||0);
  const sugerido=roundUp(porUnidad*(+r.margen||2.5));
  const precio=+r.precio>0?+r.precio:sugerido;
  return {tanda,porUnidad,sugerido,precio,ganancia:precio-porUnidad};
}

let tab='productos';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
function setTab(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('#fab').style.display=t==='resumen'?'none':'block';render();window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));

function render(){
  const v=$('#view');
  if(tab==='productos'){
    v.innerHTML=`<h2>Mis productos</h2><p class="hint">Tocá un producto para ver o cambiar su receta.</p>`+
    (db.recetas.length?db.recetas.map(r=>{const c=costos(r);return `
      <div class="card tap" onclick="editReceta('${r.id}')">
        <div class="row"><div><div class="title">${esc(r.nombre)}</div><div class="sub">Rinde ${r.rinde} ${r.rinde==1?'unidad':'unidades'} por tanda</div></div><span class="badge">×${r.margen}</span></div>
        <div class="grid3">
          <div class="stat"><div class="k">Me cuesta</div><div class="v">${money(c.porUnidad)}</div></div>
          <div class="stat"><div class="k">Precio</div><div class="v rose">${money(c.precio)}</div></div>
          <div class="stat"><div class="k">Gano</div><div class="v mint">${money(c.ganancia)}</div></div>
        </div></div>`}).join(''):'<div class="empty">Todavía no cargaste productos.<br>Tocá + para agregar uno.</div>');
  }
  if(tab==='insumos'){
    v.innerHTML=`<h2>Insumos</h2><p class="hint">Cargá lo que pagás por cada paquete. Si sube un precio, cambialo acá y se actualizan todos tus productos.</p>`+
    db.insumos.map(i=>`<div class="card tap" onclick="editInsumo('${i.id}')"><div class="row">
      <div><div class="title">${esc(i.nombre)}</div><div class="sub">${money(i.precio)} por ${i.cantidad} ${i.unidad}</div></div>
      <div style="text-align:right"><div style="font-weight:700">${money2(unitCost(i))}</div><div class="sub">por ${i.unidad}</div></div>
    </div></div>`).join('');
  }
  if(tab==='pedidos'){
    const ps=[...db.pedidos].sort((a,b)=>b.fecha.localeCompare(a.fecha));
    v.innerHTML=`<h2>Pedidos</h2><p class="hint">Tocá el estado para pasarlo a Entregado o Cobrado.</p>`+
    (ps.length?ps.map(p=>{const r=rec(p.recetaId);const c=r?costos(r):{precio:0};const [y,m,d]=p.fecha.split('-');return `
      <div class="card"><div class="row">
        <div onclick="editPedido('${p.id}')" style="cursor:pointer;flex:1"><div class="title">${esc(p.cliente)}</div>
        <div class="sub">${p.cantidad} × ${esc(r?r.nombre:'(producto borrado)')} · ${d}/${m}</div></div>
        <div style="text-align:right"><div style="font-weight:700;margin-bottom:6px">${money(c.precio*p.cantidad)}</div>
        <button class="chip ${p.estado}" onclick="ciclo('${p.id}')">${ESTADOS[p.estado]}</button></div>
      </div></div>`}).join(''):'<div class="empty">Sin pedidos todavía.</div>');
  }
  if(tab==='resumen'){
    const now=new Date();const ym=isoDay(0).slice(0,7);
    const ps=db.pedidos.filter(p=>p.fecha.startsWith(ym));
    let ventas=0,costo=0,porCobrar=0,pend=0;const porProd={};
    ps.forEach(p=>{const r=rec(p.recetaId);if(!r)return;const c=costos(r);const tot=c.precio*p.cantidad;
      ventas+=tot;costo+=c.porUnidad*p.cantidad;if(p.estado!=='cobr')porCobrar+=tot;if(p.estado==='pend')pend++;
      porProd[r.nombre]=(porProd[r.nombre]||0)+tot});
    const max=Math.max(1,...Object.values(porProd));
    v.innerHTML=`<h2>Mi mes · ${MESES[now.getMonth()]}</h2>
      <div class="card"><div class="sub">Lo que gané este mes</div><div class="big">${money(ventas-costo)}</div>
        <div class="grid3" style="grid-template-columns:1fr 1fr">
          <div class="stat"><div class="k">Vendí</div><div class="v">${money(ventas)}</div></div>
          <div class="stat"><div class="k">Gasté en insumos</div><div class="v">${money(costo)}</div></div>
        </div></div>
      <div class="card"><div class="row"><div><div class="title">Me falta cobrar</div><div class="sub">Pedidos entregados o pendientes</div></div><div class="v rose" style="font-size:20px;font-weight:800">${money(porCobrar)}</div></div></div>
      <div class="card"><div class="row"><div><div class="title">Pedidos por hacer</div><div class="sub">Todavía pendientes</div></div><div style="font-size:24px;font-weight:800;color:var(--amber)">${pend}</div></div></div>
      <div class="card"><div class="title" style="margin-bottom:8px">Qué vendí más</div>
        ${Object.entries(porProd).sort((a,b)=>b[1]-a[1]).map(([n,t])=>`<div style="margin:10px 0"><div class="row" style="font-size:14px"><span>${esc(n)}</span><b>${money(t)}</b></div><div class="bar"><span style="width:${t/max*100}%"></span></div></div>`).join('')||'<div class="sub">Sin ventas este mes.</div>'}
      </div>
      <button class="btn ghost" onclick="if(confirmReset())reset()">Volver a los datos de ejemplo</button>`;
  }
}
function confirmReset(){return true}
function reset(){db=sample();save();render();toast('Datos de ejemplo restaurados')}

function ciclo(id){const p=db.pedidos.find(x=>x.id===id);p.estado=NEXT[p.estado];save();render();toast(`${p.cliente}: ${ESTADOS[p.estado]}`)}

/* ---------- hojas (formularios) ---------- */
function openSheet(html){$('#sheet').innerHTML=html;$('#sheetBg').classList.add('open')}
function closeSheet(){$('#sheetBg').classList.remove('open')}
$('#sheetBg').onclick=e=>{if(e.target.id==='sheetBg')closeSheet()};

function editInsumo(id){
  const i=id?ins(id):{nombre:'',precio:'',cantidad:'',unidad:'g'};
  openSheet(`<h3>${id?'Editar':'Nuevo'} insumo</h3>
    <label>Nombre</label><input id="f-nom" value="${esc(i.nombre)}" placeholder="Ej: Harina 0000">
    <div class="two"><div><label>Precio que pagás</label><input id="f-pre" type="number" inputmode="decimal" value="${i.precio}" placeholder="$"></div>
    <div><label>Cantidad del paquete</label><input id="f-can" type="number" inputmode="decimal" value="${i.cantidad}"></div></div>
    <label>Unidad</label><div class="seg" id="f-uni">${['g','ml','u'].map(u=>`<button type="button" class="${i.unidad===u?'on':''}" data-u="${u}">${{g:'gramos',ml:'mililitros',u:'unidades'}[u]}</button>`).join('')}</div>
    <div class="live" id="f-live"></div>
    <button class="btn pri" id="f-ok">Guardar</button>
    ${id?`<button class="btn ghost" onclick="delInsumo('${id}')">Borrar insumo</button>`:''}`);
  let uni=i.unidad;
  const upd=()=>{const p=+$('#f-pre').value,c=+$('#f-can').value;$('#f-live').innerHTML=`<div class="row"><span>Te sale</span><b>${c?money2(p/c):'—'} por ${uni}</b></div>`};
  document.querySelectorAll('#f-uni button').forEach(b=>b.onclick=()=>{uni=b.dataset.u;document.querySelectorAll('#f-uni button').forEach(x=>x.classList.toggle('on',x===b));upd()});
  ['#f-pre','#f-can'].forEach(s=>$(s).oninput=upd);upd();
  $('#f-ok').onclick=()=>{const nombre=$('#f-nom').value.trim();if(!nombre)return toast('Poné un nombre');
    const o={nombre,precio:+$('#f-pre').value||0,cantidad:+$('#f-can').value||1,unidad:uni};
    if(id)Object.assign(i,o);else db.insumos.push({id:uid(),...o});save();closeSheet();render();toast('Insumo guardado ✔')};
}
function delInsumo(id){if(db.recetas.some(r=>r.items.some(it=>it.insumoId===id)))return toast('Se usa en una receta, sacalo primero');db.insumos=db.insumos.filter(i=>i.id!==id);save();closeSheet();render()}

function editReceta(id){
  const r0=id?rec(id):{nombre:'',rinde:1,packaging:0,margen:2.5,precio:0,items:[]};
  const r=JSON.parse(JSON.stringify(r0));
  const opts=sel=>db.insumos.map(i=>`<option value="${i.id}" ${i.id===sel?'selected':''}>${esc(i.nombre)}</option>`).join('');
  openSheet(`<h3>${id?esc(r.nombre):'Nuevo producto'}</h3>
    <label>Nombre del producto</label><input id="r-nom" value="${esc(r.nombre)}" placeholder="Ej: Cupcakes">
    <div class="two"><div><label>¿Cuántas unidades salen?</label><input id="r-rin" type="number" inputmode="numeric" value="${r.rinde}"></div>
    <div><label>Packaging por unidad</label><input id="r-pac" type="number" inputmode="decimal" value="${r.packaging}" placeholder="$"></div></div>
    <label>Ingredientes de una tanda</label><div id="r-items"></div>
    <button class="btn sec" id="r-add" style="margin-top:6px;padding:10px">+ Agregar ingrediente</button>
    <label>¿Cuánto querés ganar?</label><div class="seg" id="r-mar">${[2,2.5,3].map(m=>`<button type="button" data-m="${m}" class="${r.margen==m?'on':''}">×${m}</button>`).join('')}</div>
    <label>Precio de venta (opcional, si no usa el sugerido)</label><input id="r-pre" type="number" inputmode="decimal" value="${r.precio||''}" placeholder="Usar precio sugerido">
    <div class="live" id="r-live"></div>
    <button class="btn pri" id="r-ok">Guardar producto</button>
    ${id?`<button class="btn ghost" onclick="delReceta('${id}')">Borrar producto</button>`:''}`);
  const drawItems=()=>{$('#r-items').innerHTML=r.items.map((it,k)=>`<div class="ing">
      <select data-k="${k}" class="i-sel">${opts(it.insumoId)}</select>
      <div style="position:relative"><input data-k="${k}" class="i-can" type="number" inputmode="decimal" value="${it.cant}" style="padding-right:30px"><span class="u" style="position:absolute;right:10px;top:14px">${ins(it.insumoId)?.unidad||''}</span></div>
      <button class="x" data-k="${k}">×</button></div>`).join('')||'<div class="sub">Agregá los ingredientes que usás.</div>';
    document.querySelectorAll('.i-sel').forEach(s=>s.onchange=()=>{r.items[s.dataset.k].insumoId=s.value;drawItems();live()});
    document.querySelectorAll('.i-can').forEach(s=>s.oninput=()=>{r.items[s.dataset.k].cant=+s.value;live()});
    document.querySelectorAll('#r-items .x').forEach(b=>b.onclick=()=>{r.items.splice(b.dataset.k,1);drawItems();live()});};
  const live=()=>{r.rinde=+$('#r-rin').value||1;r.packaging=+$('#r-pac').value||0;r.precio=+$('#r-pre').value||0;const c=costos(r);
    $('#r-live').innerHTML=`<div class="row"><span>Costo de la tanda</span><b>${money(c.tanda)}</b></div>
      <div class="row"><span>Costo por unidad</span><b>${money(c.porUnidad)}</b></div>
      <div class="row"><span>Precio sugerido (×${r.margen})</span><b style="color:var(--rose)">${money(c.sugerido)}</b></div>
      <div class="row tot"><span>Ganás por unidad</span><b style="color:var(--mint)">${money(c.ganancia)}</b></div>`};
  drawItems();live();
  ['#r-rin','#r-pac','#r-pre'].forEach(s=>$(s).oninput=live);
  document.querySelectorAll('#r-mar button').forEach(b=>b.onclick=()=>{r.margen=+b.dataset.m;document.querySelectorAll('#r-mar button').forEach(x=>x.classList.toggle('on',x===b));live()});
  $('#r-add').onclick=()=>{if(!db.insumos.length)return toast('Primero cargá insumos');r.items.push({insumoId:db.insumos[0].id,cant:0});drawItems();live()};
  $('#r-ok').onclick=()=>{r.nombre=$('#r-nom').value.trim();if(!r.nombre)return toast('Poné un nombre');
    if(id)Object.assign(r0,r);else db.recetas.push({...r,id:uid()});save();closeSheet();render();toast('Producto guardado ✔')};
}
function delReceta(id){db.recetas=db.recetas.filter(r=>r.id!==id);save();closeSheet();render()}

function editPedido(id){
  const p=id?db.pedidos.find(x=>x.id===id):{cliente:'',recetaId:db.recetas[0]?.id,cantidad:1,fecha:isoDay(0),estado:'pend'};
  if(!db.recetas.length)return toast('Primero cargá un producto');
  openSheet(`<h3>${id?'Editar':'Nuevo'} pedido</h3>
    <label>Cliente</label><input id="p-cli" value="${esc(p.cliente)}" placeholder="Nombre o quién lo pidió">
    <label>Producto</label><select id="p-rec">${db.recetas.map(r=>`<option value="${r.id}" ${r.id===p.recetaId?'selected':''}>${esc(r.nombre)} · ${money(costos(r).precio)}</option>`).join('')}</select>
    <div class="two"><div><label>Cantidad</label><input id="p-can" type="number" inputmode="numeric" value="${p.cantidad}"></div>
    <div><label>Fecha de entrega</label><input id="p-fec" type="date" value="${p.fecha}"></div></div>
    <div class="live" id="p-live"></div>
    <button class="btn pri" id="p-ok">Guardar pedido</button>
    ${id?`<button class="btn ghost" onclick="delPedido('${id}')">Borrar pedido</button>`:''}`);
  const live=()=>{const r=rec($('#p-rec').value);const c=costos(r);const n=+$('#p-can').value||0;
    $('#p-live').innerHTML=`<div class="row"><span>Total a cobrar</span><b style="color:var(--rose)">${money(c.precio*n)}</b></div><div class="row"><span>Ganás en este pedido</span><b style="color:var(--mint)">${money(c.ganancia*n)}</b></div>`};
  ['#p-rec','#p-can'].forEach(s=>$(s).oninput=live);$('#p-rec').onchange=live;live();
  $('#p-ok').onclick=()=>{const cliente=$('#p-cli').value.trim();if(!cliente)return toast('Poné el nombre del cliente');
    const o={cliente,recetaId:$('#p-rec').value,cantidad:+$('#p-can').value||1,fecha:$('#p-fec').value||isoDay(0)};
    if(id)Object.assign(p,o);else db.pedidos.push({id:uid(),estado:'pend',...o});save();closeSheet();render();toast('Pedido guardado ✔')};
}
function delPedido(id){db.pedidos=db.pedidos.filter(p=>p.id!==id);save();closeSheet();render()}

$('#fab').onclick=()=>({productos:()=>editReceta(),insumos:()=>editInsumo(),pedidos:()=>editPedido()})[tab]?.();
render();
</script>
</body>
</html>
